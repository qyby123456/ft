allprojects {
    afterEvaluate {
        tasks.register('compileGongdi', JavaCompile) {
            source = project.files([
                'src/main/java/net/farmingtales/ftboss/entity/EasterBossEntity.java',
                'src/main/java/net/farmingtales/ftboss/boss/ai/GongdiSkills.java',
                'src/main/java/net/farmingtales/ftboss/util/GongdiCombatRules.java',
                'src/main/java/net/farmingtales/ftboss/util/HiddenBossCastRules.java',
                'src/main/java/net/farmingtales/ftboss/effect/FTEffects.java',
                'src/main/java/net/farmingtales/ftboss/effect/LethalTempoEffect.java',
                'src/main/java/net/farmingtales/ftboss/client/model/EasterBossModel.java',
                'src/main/java/net/farmingtales/ftboss/client/render/EasterSkillVisual.java'
            ].collect { project.file(it) })
            classpath = tasks.named('compileJava').get().classpath + project.files(
                    project.file('build/classes/java/main'), project.file('compile-baseline'))
            destinationDirectory = project.layout.buildDirectory.dir('gongdi/classes')
            javaCompiler = tasks.named('compileJava').get().javaCompiler
            options.encoding = 'UTF-8'
            options.compilerArgs += ['-implicit:none']
            doLast {
                project.file('build/gongdi/classpath.txt').text = classpath.asPath
            }
        }
    }
}
