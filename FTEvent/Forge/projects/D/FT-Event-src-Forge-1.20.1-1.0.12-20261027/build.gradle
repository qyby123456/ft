plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'cn.farmingtales.qysevent'
version = '1.0.12'

base {
    archivesName = 'qys-event-forge-1.20.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(JavaExec).configureEach {
    doFirst {
        file('build/verification/temp').mkdirs()
        file('build/verification/home').mkdirs()
    }
    jvmArgs '-XX:-UsePerfData',
            '-Djava.io.tmpdir=' + file('build/verification/temp').absolutePath,
            '-Duser.home=' + file('build/verification/home').absolutePath
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'qys-event',
            'Specification-Vendor': 'FarmingTales',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'FarmingTales',
            'MixinConfigs': 'qys_event.mixins.json'
        ])
    }
}


tasks.register('verifyQysEvent', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.farmingtales.qysevent.QysEventVerifier'
}

check.dependsOn verifyQysEvent
