<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FT · 气象、预言与许愿核心</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei",sans-serif;color:#ede4d3;background:#111a1b}*{box-sizing:border-box}body{margin:0}header{padding:28px 36px 15px}h1{font-size:25px;letter-spacing:2px;margin:4px 0 9px}small{color:#afbaa9;letter-spacing:4px;font-size:11px}p{color:#b4b8a8;font-size:13px;margin:0}nav{padding:15px 36px;display:flex;gap:9px;flex-wrap:wrap}button{font:inherit;font-size:13px;padding:9px 15px;border:1px solid #4d5e53;color:#d8d9c5;background:#22302b;border-radius:4px;cursor:pointer}button[aria-pressed=true]{color:#f8e1a1;background:#594b31;border-color:#ac965c}button:hover{border-color:#cbba8b}.stage{position:relative;height:min(68vh,700px);min-height:350px}canvas{display:block;width:100%;height:100%;touch-action:none}.captions{position:absolute;bottom:14px;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;text-align:center;pointer-events:none}.captions strong{font-size:18px;letter-spacing:3px}.captions span{display:block;color:#a5b6a9;font-size:11px;margin-top:8px;letter-spacing:2px}footer{display:flex;justify-content:space-between;gap:16px;padding:18px 36px;color:#a2afa2;font-size:12px;flex-wrap:wrap}#status{color:#bdab7b}@media(max-width:600px){header{padding:20px 18px 10px}h1{font-size:20px}nav{padding:10px 18px}button{padding:9px 10px}.captions strong{font-size:14px}.captions span{font-size:9px;letter-spacing:0}footer{padding:15px 18px}}
</style>
<style>.captions[hidden]{display:none}</style>
<header><small>FARMING TALES / INSTRUMENTS</small><h1>气象、预言与许愿核心</h1><p>原版方块模型与像素材质 · 铜木气象台 / 紫晶占卜台 / 翡翠许愿祭坛</p></header>
<nav aria-label="模型与视角">
<button data-model="both" aria-pressed="true">并排展示</button><button data-model="weather_forecaster" aria-pressed="false">天气预报机</button><button data-model="oracle" aria-pressed="false">预言机</button>
<button data-model="wishing_well_core" aria-pressed="false">许愿井核心</button>
<button data-view="perspective" aria-pressed="true">立体</button><button data-view="front" aria-pressed="false">正面</button><button data-view="back" aria-pressed="false">背面</button><button data-view="left" aria-pressed="false">左侧</button><button data-view="right" aria-pressed="false">右侧</button><button data-view="top" aria-pressed="false">顶部</button><button data-view="bottom" aria-pressed="false">底部</button><button id="wireframe" aria-pressed="false">线框</button>
</nav>
<div class="stage"><canvas id="stage" aria-label="可旋转的三维模型"></canvas><div class="captions" id="captions"><div><strong>天气预报机</strong><span>氧化铜 · 黄铜表盘 · 气象传感器</span></div><div><strong>预言机</strong><span>紫晶球 · 星盘 · 古金符文</span></div></div></div>
<footer><span>拖动旋转 · 滚轮缩放 · 模型与游戏资源一致，光照为预览效果</span><span id="status">加载模型…</span></footer>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#111a1b');
const camera = new THREE.OrthographicCamera(-2,2,1.5,-1.5,0.01,100);
const controls = new OrbitControls(camera,canvas);
controls.target.set(0,.43,0);
controls.enablePan = false;
controls.minZoom = .5;
controls.maxZoom = 3;
scene.add(new THREE.AmbientLight(0xffffff,1.35));
const key = new THREE.DirectionalLight(0xfff0d1,2.4);
key.position.set(-3,5,-4);scene.add(key);
const fill = new THREE.DirectionalLight(0x9dc7d2,.8);
fill.position.set(4,3,2);scene.add(fill);
const grid = new THREE.GridHelper(8,32,0x3a544c,0x233630);
grid.position.y = -.003;scene.add(grid);
const groups = new Map();
const materials = [];
const modelCounts = {};
let active = 'both';
let currentView = 'perspective';
let wireframe = false;

function facePoints(direction,minimum,maximum){
    const [left,bottom,near] = minimum;
    const [right,top,far] = maximum;
    const points = {
        north:[[right,top,near],[right,bottom,near],[left,bottom,near],[left,top,near]],
        south:[[left,top,far],[left,bottom,far],[right,bottom,far],[right,top,far]],
        west:[[left,top,near],[left,bottom,near],[left,bottom,far],[left,top,far]],
        east:[[right,top,far],[right,bottom,far],[right,bottom,near],[right,top,near]],
        up:[[left,top,near],[left,top,far],[right,top,far],[right,top,near]],
        down:[[left,bottom,far],[left,bottom,near],[right,bottom,near],[right,bottom,far]],
    };
    return points[direction];
}

function build(model,texture){
    const geometry = new THREE.BufferGeometry();
    const positions = [], coordinates = [];
    for(const element of model.elements){
        for(const [direction,face] of Object.entries(element.faces)){
            const points = facePoints(direction,element.from,element.to).map(point=>new THREE.Vector3(...point));
            if(element.rotation){
                const origin = new THREE.Vector3(...element.rotation.origin);
                const axis = new THREE.Vector3(Number(element.rotation.axis==='x'),Number(element.rotation.axis==='y'),Number(element.rotation.axis==='z'));
                for(const point of points)point.sub(origin).applyAxisAngle(axis,THREE.MathUtils.degToRad(element.rotation.angle)).add(origin);
            }
            const [left,top,right,bottom] = face.uv.map(value=>value/16);
            const faceUvs = [[left,1-top],[left,1-bottom],[right,1-bottom],[right,1-top]];
            for(const index of [0,1,2,0,2,3]){
                const point = points[index];
                positions.push(point.x/16-.5,point.y/16,point.z/16-.5);
                coordinates.push(...faceUvs[index]);
            }
        }
    }
    geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    geometry.setAttribute('uv',new THREE.Float32BufferAttribute(coordinates,2));
    geometry.computeVertexNormals();
    const material = new THREE.MeshStandardMaterial({map:texture,roughness:.9,metalness:0,side:THREE.FrontSide});
    materials.push(material);
    return new THREE.Mesh(geometry,material);
}

function resize(){
    const width = canvas.clientWidth,height = canvas.clientHeight;
    renderer.setSize(width,height,false);
    const heightSpan = active==='both'?1.75:active==='wishing_well_core'?1.12:1.45;
    const aspect = width/height;
    const halfHeight = Math.max(heightSpan/2,(active==='both'?1.45:.83)/aspect);
    camera.left = -halfHeight*aspect;camera.right = halfHeight*aspect;
    camera.top = halfHeight;camera.bottom = -halfHeight;
    camera.updateProjectionMatrix();
}

function setView(view){
    currentView = view;
    const positions = {perspective:[-2.7,2.15,-4],front:[0,.43,-5],back:[0,.43,5],left:[-5,.43,0],right:[5,.43,0],top:[0,5,.001],bottom:[0,-5,-.001]};
    camera.position.set(...positions[view]);
    if(['front','back','left','right'].includes(view))camera.position.y=controls.target.y;
    camera.up.set(0,1,0);
    if(view==='top')camera.up.set(0,0,1);
    if(view==='bottom')camera.up.set(0,0,-1);
    grid.visible = view!=='bottom';
    camera.lookAt(controls.target);controls.update();
    for(const button of document.querySelectorAll('[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===view));
}

function setModel(name){
    active = name;
    for(const [id,group] of groups){group.visible=(name==='both'&&id!=='wishing_well_core')||id===name;group.position.x=name==='both'?(id==='weather_forecaster'?.85:-.85):0;}
    document.getElementById('captions').hidden = name!=='both';
    for(const button of document.querySelectorAll('[data-model]'))button.setAttribute('aria-pressed',String(button.dataset.model===name));
    controls.target.y=name==='wishing_well_core'?.23:.43;
    camera.zoom = 1;resize();setView(currentView);
}

for(const name of ['weather_forecaster','oracle','wishing_well_core']){
    const namespace=name==='wishing_well_core'?'farmingtales':'qys_event';
    const model = await (await fetch('/payload/assets/'+namespace+'/models/block/'+name+'.json')).json();
    const texture = await new THREE.TextureLoader().loadAsync('/payload/assets/'+namespace+'/textures/block/'+name+'_atlas.png');
    texture.magFilter = THREE.NearestFilter;texture.minFilter = THREE.NearestFilter;texture.generateMipmaps = false;texture.colorSpace = THREE.SRGBColorSpace;
    const group = new THREE.Group();group.add(build(model,texture));scene.add(group);groups.set(name,group);
    modelCounts[name] = model.elements.length;
}
for(const button of document.querySelectorAll('[data-model]'))button.addEventListener('click',()=>setModel(button.dataset.model));
for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>setView(button.dataset.view));
document.getElementById('wireframe').addEventListener('click',()=>{wireframe=!wireframe;for(const material of materials)material.wireframe=wireframe;document.getElementById('wireframe').setAttribute('aria-pressed',String(wireframe));});
window.addEventListener('resize',resize);
window.ftPreview = {setModel,setView,snapshot:()=>({active,view:currentView,wireframe,modelCounts,triangles:renderer.info.render.triangles})};
setModel(location.hash==='#wishing_well_core'?'wishing_well_core':'both');setView('perspective');
document.getElementById('status').textContent = `${modelCounts.weather_forecaster} / ${modelCounts.oracle} / ${modelCounts.wishing_well_core} 个模型部件 · 128 px 像素材质`;
window.ftPreviewReady = true;
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</html>
