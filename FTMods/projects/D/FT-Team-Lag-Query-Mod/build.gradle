plugins { id 'net.minecraftforge.gradle' version '[6.0.16,6.2)' }
group = 'net.farmingtales'
version = '1.0.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets {
    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('gametest-run')
            args '--mixin', 'ftteamlag.mixins.json'
            property 'forge.enabledGameTestNamespaces', 'ftteamlag'
            property 'ftteamlag.withoutObservable', project.hasProperty('withoutObservable').toString()
            property 'ftteamlag.withoutRefinedStorage', project.hasProperty('withoutRefinedStorage').toString()
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            mods { ftteamlag { source sourceSets.main; source sourceSets.gameTest } }
        }
    }
}
repositories { flatDir { dirs 'libs' } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    compileOnly fg.deobf('local:observable:4.4.2')
    compileOnly fg.deobf('local:refinedstorage:1.12.4')
    compileOnly fg.deobf('local:kubejs-forge:2001.6.5-build.16')
    if (!project.hasProperty('withoutObservable')) runtimeOnly fg.deobf('local:observable:4.4.2')
    if (!project.hasProperty('withoutRefinedStorage')) runtimeOnly fg.deobf('local:refinedstorage:1.12.4')
    runtimeOnly fg.deobf('local:architectury:9.2.14-forge')
    runtimeOnly fg.deobf('local:kotlinforforge:4.12.0-all')
    runtimeOnly fg.deobf('local:kubejs-forge:2001.6.5-build.16')
    runtimeOnly fg.deobf('local:rhino-forge:2001.2.3-build.10')
    runtimeOnly fg.deobf('local:farmingtales:1.0.11-kubejs')
    runtimeOnly fg.deobf('local:puffish_skills:0.18.3-1.20-forge')
    runtimeOnly fg.deobf('local:ftb-library-forge:2001.2.12')
    runtimeOnly fg.deobf('local:ftb-teams-forge:2001.3.2')
    runtimeOnly fg.deobf('local:ftb-chunks-forge:2001.3.8')
}
sourceSets.gameTest.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.gameTest.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
if (project.hasProperty('withoutRefinedStorage')) sourceSets.gameTest.java.exclude('**/StorageGameTests.java')
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'gameTestClasses' }
jar {
    archiveFileName = 'qys-team-lag-query.jar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'ftteamlag.mixins.json', 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
