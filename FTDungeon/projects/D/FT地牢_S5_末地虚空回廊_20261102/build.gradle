plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main {
    java.srcDirs = ['tools/native']
    resources.srcDirs = ['qa-resources']
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('qa/forge-run')
            property 'forge.enabledGameTestNamespaces', 'fts5qa'
            property 'fts5qa.root', projectDir.absolutePath
            mods { fts5qa { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
