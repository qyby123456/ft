plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file(providers.gradleProperty('runDirectory').getOrElse('qa/forge-run'))
            property 'forge.enabledGameTestNamespaces', 'ftr4qa'
            property 'ftr4qa.root', projectDir.absolutePath
            property 'ftr4qa.bootstrap', providers.gradleProperty('bootstrap').getOrElse('false')
            jvmArgs '-Xmx768M'
            mods {
                ftr4qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
