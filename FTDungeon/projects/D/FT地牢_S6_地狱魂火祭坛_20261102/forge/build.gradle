plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            jvmArgs '-Xmx2G'
            workingDirectory project.file('run/s6-only-gametest')
            property 'forge.enabledGameTestNamespaces', 'fts6qa'
            property 'fts6qa.root', projectDir.parentFile.absolutePath
            mods {
                fts6qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
