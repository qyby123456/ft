plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'net.farmingtales'
version = '0.1.0'
base { archivesName = 'ft-dungeon-loot-stand-forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
        }
        gameTestServer {
            workingDirectory project.file('run/loot-verification')
            property 'forge.enabledGameTestNamespaces', 'ftdungeonloot'
            mods {
                ftdungeonloot {
                    source sourceSets.main
                    source sourceSets.test
                }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
sourceSets {
    modelCheck {
        java.srcDirs = ['tools/java']
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('verifyMinecraftModel', JavaExec) {
    dependsOn 'modelCheckClasses'
    classpath = sourceSets.modelCheck.runtimeClasspath
    mainClass = 'MinecraftModelCheck'
    args projectDir.absolutePath
}
tasks.register('verifyLootResources', Exec) {
    commandLine 'node', file('tools/verify-resources.mjs').absolutePath
}
tasks.named('check') { dependsOn 'verifyMinecraftModel', 'verifyLootResources' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
jar {
    manifest { attributes 'Implementation-Title': 'FT Dungeon Loot Stand', 'Implementation-Version': project.version }
    finalizedBy 'reobfJar'
}
