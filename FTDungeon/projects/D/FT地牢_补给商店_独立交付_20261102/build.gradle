plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir 'src/compat/java'

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('qa/forge-run')
            property 'forge.enabledGameTestNamespaces', 'ftshopqa'
            property 'ftshopqa.root', projectDir.absolutePath
            jvmArgs '-Xmx768M'
            mods {
                ftshopqa { source sourceSets.main }
            }
        }
    }
}

repositories {
    flatDir { dirs 'dependencies' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('local.shop:ft-dungeon-trading-forge-1.20.1:1.2.0')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
