plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=2', '-Dfile.encoding=UTF-8'
            workingDirectory project.file('run/r2-only-gametest')
            property 'forge.enabledGameTestNamespaces', 'ftr2qa'
            property 'ftr2qa.root', projectDir.parentFile.absolutePath
            mods {
                ftr2qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
