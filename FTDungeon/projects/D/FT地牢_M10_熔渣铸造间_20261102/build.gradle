plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main {
    java.srcDirs = ['tools']
    java.include 'M10Verification.java'
    resources.srcDirs = ['tools/verification-resources']
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file(findProperty('m10RunDir') ?: 'qa/forge-run')
            property 'forge.enabledGameTestNamespaces', 'ftm10verification'
            property 'ftm10.project', projectDir.absolutePath
            mods {
                ftm10verification { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
