plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.corridors05qa'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file(providers.gradleProperty('runDirectory').getOrElse('isolated-run'))
            property 'forge.enabledGameTestNamespaces', 'corridors05qa'
            property 'corridors05qa.root', projectDir.parentFile.absolutePath
            jvmArgs '-Xmx768M', '-XX:ActiveProcessorCount=2'
            mods {
                corridors05qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
