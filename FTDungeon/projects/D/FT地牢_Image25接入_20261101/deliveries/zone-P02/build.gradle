plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('qa/forge-runs/' + providers.gradleProperty('qaRun').getOrElse('manual'))
            property 'forge.enabledGameTestNamespaces', 'ftp02qa'
            property 'ftp02qa.root', projectDir.absolutePath
            jvmArgs '-Xmx1024M', '-XX:ActiveProcessorCount=4'
            mods { ftp02qa { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
