plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.corridors16qa'
version = '1.0-verification-only'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('../qa/forge-run')
            property 'forge.enabledGameTestNamespaces', 'corridors16qa'
            property 'corridors16qa.root', projectDir.parentFile.absolutePath
            jvmArgs '-Xmx1G', '-XX:ActiveProcessorCount=2'
            mods {
                corridors16qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
