plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'net.farmingtales.zonec04qa'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('run/c04-isolated')
            property 'forge.enabledGameTestNamespaces', 'zonec04qa'
            property 'zonec04qa.root', projectDir.parentFile.absolutePath
            jvmArgs '-Xmx768M'
            mods {
                zonec04qa { source sourceSets.main }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
