plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'net.farmingtales.corridorverification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            jvmArgs '-Xmx2G'
            workingDirectory project.file('run/' + (project.findProperty('qaFixture') ?: 'corridor-m07-only-gametest'))
            property 'forge.enabledGameTestNamespaces', 'ftcorridorm07qa'
            property 'ftcorridorm07qa.root', projectDir.parentFile.absolutePath
            mods { ftcorridorm07qa { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }

