plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main {
    java.srcDirs = ['tools']
    java.include 'CorridorM08Verification.java'
    resources.srcDirs = ['tools/verification-resources']
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            jvmArgs '-XX:ActiveProcessorCount=2', '-Xmx1024m'
            workingDirectory project.file(findProperty('m08RunDir') ?: 'qa/forge-run')
            property 'forge.enabledGameTestNamespaces', 'ftcorridorm08qa'
            property 'ftcorridorm08.project', projectDir.absolutePath
            mods {
                ftcorridorm08qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
