plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'net.farmingtales.zoner03qa'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            jvmArgs '-Xmx1536M'
            workingDirectory project.file('run/' + (project.findProperty('qaFixture') ?: 'zone-r03-isolated-only'))
            property 'forge.enabledGameTestNamespaces', 'ftzoner03qa'
            property 'ftzoner03qa.root', projectDir.parentFile.absolutePath
            mods { ftzoner03qa { source sourceSets.main } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
