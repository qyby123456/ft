plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('qa/forge-runs/' + providers.gradleProperty('qaRun').getOrElse('manual'))
            property 'forge.enabledGameTestNamespaces', 'ftcorridors13qa'
            property 'ftcorridors13qa.root', projectDir.absolutePath
            jvmArgs '-Xmx768M', '-Djava.awt.headless=true'
            mods {
                ftcorridors13qa { source sourceSets.main }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
