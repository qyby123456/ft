plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'net.farmingtales.verification'
version = '1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file(providers.gradleProperty('runDirectory').get())
            property 'forge.enabledGameTestNamespaces', 'fts06qa'
            property 'fts06qa.root', projectDir.parentFile.absolutePath
            jvmArgs '-Xmx768M', '-Djava.awt.headless=true'
            mods {
                fts06qa { source sourceSets.main }
            }
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
