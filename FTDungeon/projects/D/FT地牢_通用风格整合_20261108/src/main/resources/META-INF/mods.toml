[[mods]]
modId="ftdungeonmobs"
version="0.27.1"
displayName="FT地牢"
credits="模型提供者：一颗大豆（b站uid355533780）"
description='''
内置混沌房网、月蚀钟塔、紫晶群系与通用风格生成器；古林、砂岩太阳遗迹、冰霜档案馆和外部JSON风格自动接入统一地牢门菜单。保留既有注册ID；已有实例须使用其生成时一致的资源与配置。
FT地牢怪物：骷髅战士、骷髅弓手、骷髅法师和骷髅王。
独立模型动画准备版，包含四种刷怪蛋、FT地牢怪物创造栏、基础战斗 AI 和动画预览命令。
支持五档难度、自定义生命/攻击/物理护甲/铁魔法魔抗/法强，以及管理员命令和 Java API。
血棘祭炉占一格空间，使用独立黑铁骨饰模型；右键切换五档局部难度，动态火焰依次为苍蓝、翠绿、鎏金、紫焰和猩红。
旧长矛火炬模型已移除；旧 ID 仅保留存档兼容，使用血棘祭炉外观，不再提供旧合成或创造栏入口。
新增三格宽四格高的地牢入口门与返程门、独立地牢维度和落地大厅；门口六格内的火盆实时控制地牢中自动分级的 FT 怪物。
火盆熄灭关入口门，1～5档保持开启，传送门雾色同步苍蓝、翠绿、鎏金、紫焰、猩红。首位玩家成功进入后锁定本轮火盆与难度，再开放5分钟供队友进入；后续玩家不延长时间，到期关闭入口、拒绝新入场，返程门始终可用。窗口结束且本轮玩家全部离开后解锁。保留整数长方体、2秒铁闸动画与防夹，无压力板。
新增九种整数方块血池建筑部件、真实可装桶祭祀血液与安全搭建命令。完整阶梯血池收取16点供品后，空手确认触发10秒红石输出及可取消Forge事件，随后冷却30秒；不自动启用怪物波次或挑战扩展。具体规则与实机边界见BLOOD_POOL.md。
原样接入31号大型场景与30_1紫晶侧区，成功入场后安全预检、一次性扩建；不覆盖旧建筑或重置玩家改动。31号需Lootr，原始容器为空，未自动配置战斗波次和奖励。管理员可用/ftdungeon rooms status和/ftdungeon rooms build。
新增L1/L2/M1/M2/S1/S2/L3/L4/S3九间原版主题房，通过三格宽道路连接；逐房来源校验、安全预检和独立持久标记，后续追加不重建旧房。
新增24种独立地牢建筑方块：墙地材、柱拱件、囚栏骨饰、石棺与灯具。整数长方体、共用像素图集、无新增方块实体，支持四向碰撞、原版楼梯台阶和生存合成；不自动替换旧房间，不启用额外波次。详见DUNGEON_ARCHITECTURE.md。
新增细胞式地面刷怪符印：地牢房间内随机选择安全可达地面，玩家靠近六格且视线畅通时，固定刷出预先保存的一至三只怪物，每点每轮只触发一次。入口火炬难度一至五档默认每房二、四、六、八、十点；小房只出普通怪，中房和大型挑战房只出精英，怪池包含原版与可选灾变，不混入完整Boss或宠物。进入地牢强制冒险模式，保留交互与战斗，禁止破坏、放置、桶和工具改地形，离开后恢复原模式；详见SPAWN_POINTS.md与ROOM_RULES.md。
模型提供者：一颗大豆，b站uid355533780。
模型动画原始来源见 CREDITS.md。
'''

