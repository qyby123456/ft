name: Import verified FT checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify and import the source checkpoint
        env:
          FT_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import http.client
          import json
          import os
          import subprocess
          import tempfile
          import urllib.parse
          import urllib.request
          from pathlib import Path
          
          manifest = {'repository': 'qyby123456/ft', 'source_commit': '7de256416ba4987e68f5c2c7143d6bfca6ade9e6', 'base_commit': '27d20d5e1d2eb960f4a64cde9bd21230efae766c', 'release_id': 444338207, 'bundle_sha256': '82838066fc33e96c11764c9fd1d22bd1072e66f08744939c68de2a03407b452d', 'bundle_bytes': 2485921859, 'parts': [{'id': 743981621, 'name': 'ft-input-7de256416ba4-0001.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743981621', 'bytes': 134217728, 'sha256': 'b16b11b435c1c225b16954b6d08fde650b7b297f89f1286a90fffb6fe2b69b81'}, {'id': 743984102, 'name': 'ft-input-7de256416ba4-0002.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743984102', 'bytes': 134217728, 'sha256': 'da3481ef3547acaeae5a8bcc5bf1c7e240e6f6e5d44cae504a0047fbb5df4f3d'}, {'id': 743987178, 'name': 'ft-input-7de256416ba4-0003.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743987178', 'bytes': 134217728, 'sha256': '16ec6bd131af8123e2b3eaaa3438d318378ad443e59f2192d57d282f463e2918'}, {'id': 743989708, 'name': 'ft-input-7de256416ba4-0004.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743989708', 'bytes': 134217728, 'sha256': '6a6802d3fba16ecb0df09387968e6ab6878ed903c7874c1c43d31c1c9915b859'}, {'id': 743993418, 'name': 'ft-input-7de256416ba4-0005.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743993418', 'bytes': 134217728, 'sha256': 'b13a3b599e8ea226539044ec2507e4db2989da419946a0817b2873c3904222a7'}, {'id': 743996117, 'name': 'ft-input-7de256416ba4-0006.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743996117', 'bytes': 134217728, 'sha256': '04c7c98486eb8108b3655689f64ce2761015641698c7219f7b57f8e6854522d3'}, {'id': 743998977, 'name': 'ft-input-7de256416ba4-0007.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/743998977', 'bytes': 134217728, 'sha256': 'ef08c340119c4cd30c6def688504bf39dde2be6aeaeabd3c8a1fc8b1acb964a3'}, {'id': 744001690, 'name': 'ft-input-7de256416ba4-0008.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744001690', 'bytes': 134217728, 'sha256': '8bd3ab014ebb344ae3c167b4d5729fb52777a253def1f608fe657f07a105a58b'}, {'id': 744006884, 'name': 'ft-input-7de256416ba4-0009.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744006884', 'bytes': 134217728, 'sha256': '998bfec602bc49bdd02ad8f36cde22266dbea95ed36c4be3e33a8fae304c9133'}, {'id': 744011621, 'name': 'ft-input-7de256416ba4-0010.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744011621', 'bytes': 134217728, 'sha256': '5d9b3c132f7220fe3734932723f65e81006915af8b263d84a31d7dd70bb0c51e'}, {'id': 744018039, 'name': 'ft-input-7de256416ba4-0011.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744018039', 'bytes': 134217728, 'sha256': '0cbaa7671b7c548feb418811f8ea27d8bb46fc561aa956ea4ed5acdafe9d8c9f'}, {'id': 744021507, 'name': 'ft-input-7de256416ba4-0012.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744021507', 'bytes': 134217728, 'sha256': '167923340ed0bc55001d74c4fdacfbf6d884163d971e77d2d230cc83cce905e3'}, {'id': 744024475, 'name': 'ft-input-7de256416ba4-0013.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744024475', 'bytes': 134217728, 'sha256': '0c2b5124c9c9b28d02c90ae2dbb686e62113b1c6028430dda7f8dc920de852eb'}, {'id': 744027443, 'name': 'ft-input-7de256416ba4-0014.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744027443', 'bytes': 134217728, 'sha256': 'cd1da8cf145edca600cdd9486f351b66cfda91cb5b8748c343be0b59acec9578'}, {'id': 744030537, 'name': 'ft-input-7de256416ba4-0015.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744030537', 'bytes': 134217728, 'sha256': 'd0cd5dea2d314de387658d6500b7bf7a2b2b337acc7c4457f329a4cb83f92d4d'}, {'id': 744033813, 'name': 'ft-input-7de256416ba4-0016.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744033813', 'bytes': 134217728, 'sha256': 'bb642acba9490b0c1ba845cc6775a38f6255dfd5fce0d172745905debf75b1f4'}, {'id': 744036525, 'name': 'ft-input-7de256416ba4-0017.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744036525', 'bytes': 134217728, 'sha256': '784991692ecc841ec933dd78adc8cc9b65f73f76d4aaa8b4f03235a9f4401aa6'}, {'id': 744039453, 'name': 'ft-input-7de256416ba4-0018.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744039453', 'bytes': 134217728, 'sha256': '17e3401bb13bddbc8d681c8f1f6408400161d3b9b5e3e1e36ca7d5ad359edc9a'}, {'id': 744042355, 'name': 'ft-input-7de256416ba4-0019.bundlepart', 'url': 'https://api.github.com/repos/qyby123456/ft/releases/assets/744042355', 'bytes': 70002755, 'sha256': 'f0d4c2a4451a9d575aaf01d9365d51a286e30544f5920e2ade1465d23661f0d8'}], 'workflow_path': '.github/workflows/import-ft-checkpoint-7de256416ba4.yml', 'checkpoints': ['6ae6c8c2bad45a13d0d288ebb74ee7a77aa535d6', '24c9061e67ae484f8f68b27847b6a52ccb9ece2e', '26285f0396c8786acc36ff83bace54d0bdfd9c52', '0437902fdc09ca966974bbdcdedabe54c3e8932b', '2b41bd2a44527c641205e4a3394ffa749936f7f2', '7de256416ba4987e68f5c2c7143d6bfca6ade9e6']}
          token = os.environ['FT_GITHUB_TOKEN']
          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'qyby123456/ft' or manifest['repository'] != repository:
              raise RuntimeError('Repository identity differs from the authorized destination')
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  redirected = super().redirect_request(request, file_pointer, code, message, headers, new_url)
                  if redirected and urllib.parse.urlparse(request.full_url).hostname != urllib.parse.urlparse(new_url).hostname:
                      redirected.remove_header('Authorization')
                  return redirected
          
          opener = urllib.request.build_opener(SafeRedirect())
          temporary = Path(tempfile.mkdtemp(prefix='ft-verified-import-'))
          bundle = temporary / 'input.bundle'
          whole = hashlib.sha256()
          with bundle.open('wb') as output:
              for part in manifest['parts']:
                  request = urllib.request.Request(part['url'], headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/octet-stream', 'User-Agent': 'FT-verified-import'})
                  content_hash = hashlib.sha256()
                  received = 0
                  with opener.open(request, timeout=300) as response:
                      while chunk := response.read(1024 * 1024):
                          output.write(chunk)
                          content_hash.update(chunk)
                          whole.update(chunk)
                          received += len(chunk)
                  if content_hash.hexdigest() != part['sha256'] or received != part['bytes']:
                      raise RuntimeError('Input bundle part failed integrity verification')
          if whole.hexdigest() != manifest['bundle_sha256']:
              raise RuntimeError('Input bundle failed SHA256 verification')
          
          environment = os.environ.copy()
          authorization = base64.b64encode(('x-access-token:' + token).encode('utf-8')).decode('ascii')
          environment.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + authorization, GIT_TERMINAL_PROMPT='0')
          repo = temporary / 'repository'
          
          def git(*arguments, cwd=None):
              result = subprocess.run(['git', *arguments], cwd=cwd or repo, env=environment, capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError('Git ' + arguments[0] + ' failed: ' + result.stderr[-2000:])
              return result.stdout.strip()
          
          git('clone', '--no-checkout', 'https://github.com/' + repository + '.git', str(repo), cwd=temporary)
          head = git('rev-parse', 'HEAD')
          if head != os.environ['GITHUB_SHA']:
              raise RuntimeError('Main changed after workflow dispatch; refusing to overwrite concurrent work')
          git('bundle', 'verify', str(bundle))
          git('fetch', '--no-tags', str(bundle), 'refs/heads/main:refs/remotes/checkpoint/main')
          if git('rev-parse', 'refs/remotes/checkpoint/main') != manifest['source_commit']:
              raise RuntimeError('Imported source commit differs from verified checkpoint')
          git('merge-base', '--is-ancestor', manifest['base_commit'], 'refs/remotes/checkpoint/main')
          git('merge-base', '--is-ancestor', manifest['base_commit'], 'main')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          for index, checkpoint in enumerate(manifest['checkpoints'], 1):
              git('merge-base', '--is-ancestor', checkpoint, manifest['source_commit'])
              already = subprocess.run(['git', 'merge-base', '--is-ancestor', checkpoint, 'HEAD'], cwd=repo, env=environment).returncode == 0
              if already:
                  continue
              previous = git('rev-parse', 'HEAD')
              tree = git('merge-tree', '--write-tree', 'HEAD', checkpoint)
              if len(tree) != 40 or any(character not in '0123456789abcdef' for character in tree):
                  raise RuntimeError('Merge tree did not resolve to one exact tree object')
              merged = git('commit-tree', tree, '-p', previous, '-p', checkpoint, '-m', 'Merge verified FT development checkpoint ' + str(index) + ' while preserving existing main history')
              git('update-ref', 'refs/heads/main', merged, previous)
              git('push', 'origin', 'HEAD:refs/heads/main')
              print(json.dumps({'source_checkpoints_pushed': index, 'total_checkpoints': len(manifest['checkpoints'])}), flush=True)
          git('merge-base', '--is-ancestor', manifest['source_commit'], 'HEAD')
          head = git('rev-parse', 'HEAD')
          git('fsck', '--full')
          recovery = temporary / 'remote-main.bundle'
          git('bundle', 'create', str(recovery), 'refs/heads/main')
          
          def file_hash(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          
          def upload(name, path, offset, size, sha256):
              connection = http.client.HTTPSConnection('uploads.github.com', timeout=300)
              endpoint = '/repos/' + repository + '/releases/' + str(manifest['release_id']) + '/assets?name=' + urllib.parse.quote(name)
              connection.putrequest('POST', endpoint)
              connection.putheader('Authorization', 'Bearer ' + token)
              connection.putheader('User-Agent', 'FT-verified-import')
              connection.putheader('Content-Type', 'application/octet-stream')
              connection.putheader('Content-Length', str(size))
              connection.endheaders()
              remaining = size
              with path.open('rb') as stream:
                  stream.seek(offset)
                  while remaining:
                      chunk = stream.read(min(remaining, 1024 * 1024))
                      if not chunk:
                          raise RuntimeError('Unexpected recovery upload EOF')
                      connection.send(chunk)
                      remaining -= len(chunk)
              response = connection.getresponse()
              data = response.read()
              if response.status != 201:
                  raise RuntimeError('Recovery upload HTTP ' + str(response.status))
              asset = json.loads(data)
              connection.close()
              return {'id': asset['id'], 'name': asset['name'], 'url': asset['url'], 'bytes': size, 'sha256': sha256}
          
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          parts = []
          size = recovery.stat().st_size
          chunk_size = 128 * 1024 * 1024
          with recovery.open('rb') as source:
              for index, offset in enumerate(range(0, size, chunk_size), 1):
                  data = source.read(min(chunk_size, size - offset))
                  part_hash = hashlib.sha256(data).hexdigest()
                  name = 'ft-remote-' + run_id + '-' + attempt + '-' + str(index).zfill(4) + '.bundlepart'
                  parts.append(upload(name, recovery, offset, len(data), part_hash))
                  print(json.dumps({'recovery_parts_uploaded': index}), flush=True)
          receipt = {'commit': head, 'source_commit': manifest['source_commit'], 'bundle_bytes': size, 'bundle_sha256': file_hash(recovery), 'parts': parts, 'run_id': run_id, 'run_attempt': attempt, 'workflow_path': manifest['workflow_path']}
          receipt_path = temporary / 'recovery.json'
          receipt_path.write_text(json.dumps(receipt), encoding='utf-8')
          name = 'ft-remote-recovery-' + run_id + '-' + attempt + '.json'
          asset = upload(name, receipt_path, 0, receipt_path.stat().st_size, file_hash(receipt_path))
          print(json.dumps({'remote_main': head, 'recovery_manifest_asset_id': asset['id'], 'recovery_manifest_name': name}), flush=True)
          PY
