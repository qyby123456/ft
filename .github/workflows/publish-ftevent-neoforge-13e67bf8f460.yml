          token = os.environ['FT_NF_PUSH_TOKEN']
          owner = manifest['owner']
          name = manifest['name']
          if os.environ['GITHUB_REPOSITORY'] != owner + '/ft' or owner != 'qyby123456' or name != 'FTEvent-NeoForge':
              raise RuntimeError('Unexpected source or destination repository')
          authorization = base64.b64encode(('x-access-token:' + token).encode()).decode()
          environment = os.environ.copy()
          environment.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + authorization, GIT_TERMINAL_PROMPT='0')
          workspace = Path(tempfile.mkdtemp(prefix='ftevent-nf-split-'))
          
          def git(directory, *arguments, data=None):
              process = subprocess.run(['git', '-c', 'gc.auto=0', '-C', str(directory), *arguments], input=data, capture_output=True, env=environment)
              if process.returncode:
                  error = process.stderr.decode(errors='replace').replace(token, '[redacted]').replace(authorization, '[redacted]')
                  raise RuntimeError('Git ' + arguments[0] + ' failed: ' + error[-2500:])
              return process.stdout
          
          def api(path, payload=None, method=None):
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'User-Agent': 'FTEvent-loader-separation'}
              data = None if payload is None else json.dumps(payload).encode()
              if data is not None:
                  headers['Content-Type'] = 'application/json'
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com' + path, data=data, headers=headers, method=method), timeout=90) as response:
                  content = response.read()
              return json.loads(content) if content else None
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, pointer, code, message, headers, url):
                  redirected = super().redirect_request(request, pointer, code, message, headers, url)
                  if redirected and urllib.parse.urlparse(request.full_url).hostname != urllib.parse.urlparse(url).hostname:
                      redirected.remove_header('Authorization')
                  return redirected
          
          def upload(filename, data):
              connection = http.client.HTTPSConnection('uploads.github.com', timeout=180)
              endpoint = '/repos/' + owner + '/ft/releases/' + str(manifest['transport_release_id']) + '/assets?name=' + urllib.parse.quote(filename)
              connection.request('POST', endpoint, body=data, headers={'Authorization': 'Bearer ' + token, 'User-Agent': 'FTEvent-loader-separation', 'Content-Type': 'application/octet-stream', 'Content-Length': str(len(data))})
              response = connection.getresponse()
              content = response.read()
              if response.status != 201:
                  raise RuntimeError('Verification asset upload failed HTTP ' + str(response.status))
              asset = json.loads(content)
              connection.close()
              digest = hashlib.sha256(data).hexdigest()
              if asset.get('digest') != 'sha256:' + digest:
                  raise RuntimeError('GitHub verification asset digest mismatch')
              return {'id': asset['id'], 'name': filename, 'url': asset['url'], 'bytes': len(data), 'sha256': digest}
          
          asset = manifest['bundle_asset']
          request = urllib.request.Request(asset['url'], headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/octet-stream', 'User-Agent': 'FTEvent-loader-separation'})
          with urllib.request.build_opener(SafeRedirect()).open(request, timeout=180) as response:
              bundle_data = response.read()
          if len(bundle_data) != asset['bytes'] or hashlib.sha256(bundle_data).hexdigest() != asset['sha256']:
              raise RuntimeError('Input complete bundle differs from reviewed source')
          bundle = workspace / asset['name']
          bundle.write_bytes(bundle_data)
          local = workspace / 'publication.git'
          git(workspace, 'clone', '--bare', '--branch', 'main', str(bundle), str(local))
          git(local, 'fsck', '--full', '--no-dangling')
          if git(local, 'rev-parse', 'HEAD').decode().strip() != manifest['head'] or git(local, 'rev-parse', 'HEAD^{tree}').decode().strip() != manifest['tree']:
              raise RuntimeError('Input bundle commit/tree differs from reviewed NeoForge scope')
          endpoint = '/repos/' + owner + '/' + name
          repository = api(endpoint)
          if repository['id'] != manifest['repository_id'] or repository['fork'] or repository['owner']['login'].lower() != owner:
              raise RuntimeError('Destination identity changed')
          remote = 'https://github.com/' + owner + '/' + name + '.git'
          if git(workspace, 'ls-remote', remote).strip():
              raise RuntimeError('Destination is no longer empty; refusing history overwrite')
          if api('/repos/' + owner + '/FTEvent/git/ref/heads/main')['object']['sha'] != manifest['forge_head_unchanged']:
              raise RuntimeError('Existing Forge repository changed concurrently')
          git(local, 'push', remote, 'refs/heads/main:refs/heads/main')
          api(endpoint, {'default_branch': 'main'}, 'PATCH')
          restored = workspace / 'independently-cloned.git'
          git(workspace, 'clone', '--bare', '--branch', 'main', remote, str(restored))
          git(restored, 'fsck', '--full', '--no-dangling')
          if git(restored, 'rev-parse', 'HEAD').decode().strip() != manifest['head']:
              raise RuntimeError('Independent remote clone main differs')
          expected = {row['path']: row for row in manifest['expected_files']}
          actual = {}
          for entry in git(restored, 'ls-tree', '-r', '-l', '-z', 'HEAD').split(bytes([0])):
              if entry:
                  properties, filename = entry.split(bytes([9]), 1)
                  mode, kind, oid, size = properties.split()
                  if mode not in {b'100644', b'100755'} or kind != b'blob':
                      raise RuntimeError('Unexpected NeoForge repository file kind')
                  actual[filename.decode()] = {'git_object': oid.decode(), 'bytes': int(size)}
          if set(actual) != set(expected):
              raise RuntimeError('Independent NeoForge clone has missing or cross-loader files')
          verified = []
          for filename, row in expected.items():
              content = git(restored, 'show', 'HEAD:' + filename)
              digest = hashlib.sha256(content).hexdigest()
              if len(content) != row['bytes'] or digest != row['sha256']:
                  raise RuntimeError('Independent remote file SHA256 differs: ' + filename)
              verified.append({'path': filename, **actual[filename], 'sha256': digest})
          if api('/repos/' + owner + '/FTEvent/git/ref/heads/main')['object']['sha'] != manifest['forge_head_unchanged']:
              raise RuntimeError('Forge main changed during separation')
          recovery_bundle = workspace / 'ftevent-neoforge-independent-remote.bundle'
          git(restored, 'bundle', 'create', str(recovery_bundle), 'refs/heads/main')
          bundle_receipt = upload(recovery_bundle.name, recovery_bundle.read_bytes())
          report = {'complete': True, 'repository_id': repository['id'], 'repository': repository['html_url'], 'head': manifest['head'], 'tree': manifest['tree'], 'source_commit': manifest['source_commit'], 'source_prefix': manifest['source_prefix'], 'source_files': manifest['source_files'], 'verified_files': verified, 'independently_cloned_from_github': True, 'full_fsck_passed': True, 'forge_main_preserved': manifest['forge_head_unchanged'], 'run_id': os.environ['GITHUB_RUN_ID'], 'recovery_bundle': bundle_receipt}
          receipt = upload('ftevent-neoforge-independent-verification.json', json.dumps(report, ensure_ascii=False, indent=2).encode())
          print(json.dumps({'complete': True, 'verified_files': len(verified), 'report_asset': receipt}), flush=True)
